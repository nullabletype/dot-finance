name: Prototype validation
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    name: Desktop and architecture (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
          cache: npm
      - run: npm ci
      - name: Controller interruption and recovery trial
        run: npm run controller:trial
      - name: Linux desktop prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb libice6 libsm6 libfontconfig1 libx11-6 libxext6 libxrender1 strace
      - run: npm run build
      - run: npm run persistence:smoke
      - name: Persistence with networking blocked and traced (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p artifacts/offline-network
          sudo env DOTNET_EnableDiagnostics=0 DOT_FINANCE_PROTOTYPE_PASSWORD=synthetic-ci-password-not-a-user-secret unshare --net strace -f -e trace=network -o artifacts/offline-network/network.trace dotnet artifacts/desktop/DesktopShell.dll --persistence-cycle initialize artifacts/offline-network/state artifacts/desktop/Fixtures/synthetic-emma.csv
          sudo chmod -R a+rX artifacts/offline-network
          if grep -E 'socket\(|connect\(|sendto\(' artifacts/offline-network/network.trace; then
            echo 'Unexpected network syscall from persistence scenario'
            exit 1
          fi
      - name: Production native launch with networking blocked and traced (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo env PATH="$PATH" CI=true DOTNET_EnableDiagnostics=0 unshare --net strace -f -e trace=network -o artifacts/production-network.trace xvfb-run -a node scripts/production-smoke.mjs
          sudo chmod -R a+rX artifacts/production-launch-* artifacts/production-network.trace
          if grep -E 'socket\(AF_INET6?,|connect\(.*sa_family=AF_INET' artifacts/production-network.trace; then
            echo 'Unexpected Internet socket attempt from production launch'
            exit 1
          fi
      - name: Native launch (Linux virtual display)
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a npm run production:smoke
          xvfb-run -a npm run smoke
          xvfb-run -a npm run workflow:smoke
      - name: Native launch (macOS and Windows)
        if: runner.os != 'Linux'
        run: |
          npm run production:smoke
          npm run smoke
          npm run workflow:smoke
  persistence-macos:
    name: Backup cycle (macOS start)
    needs: desktop
    runs-on: macos-15
    outputs:
      backup: ${{ steps.backup.outputs.data }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - run: dotnet restore prototypes/DesktopShell/DesktopShell.csproj --locked-mode
      - run: dotnet run --project prototypes/DesktopShell/DesktopShell.csproj --no-restore --configuration Release -- --persistence-cycle initialize cycle prototypes/DesktopShell/Fixtures/synthetic-emma.csv
        env:
          DOT_FINANCE_PROTOTYPE_PASSWORD: synthetic-ci-password-not-a-user-secret
      - name: Pass encrypted backup to Windows job
        id: backup
        shell: pwsh
        run: |
          $data = [Convert]::ToBase64String([IO.File]::ReadAllBytes('cycle/portable.dotfinance-backup'))
          "data=$data" >> $env:GITHUB_OUTPUT

  persistence-windows:
    name: Backup cycle (Windows restore)
    needs: persistence-macos
    runs-on: windows-2025
    outputs:
      backup: ${{ steps.backup.outputs.data }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - run: dotnet restore prototypes/DesktopShell/DesktopShell.csproj --locked-mode
      - name: Receive encrypted backup from macOS job
        shell: pwsh
        env:
          BACKUP_DATA: ${{ needs.persistence-macos.outputs.backup }}
        run: |
          New-Item -ItemType Directory -Force incoming | Out-Null
          [IO.File]::WriteAllBytes('incoming/portable.dotfinance-backup', [Convert]::FromBase64String($env:BACKUP_DATA))
      - run: dotnet run --project prototypes/DesktopShell/DesktopShell.csproj --no-restore --configuration Release -- --persistence-cycle continue cycle prototypes/DesktopShell/Fixtures/synthetic-emma.csv incoming/portable.dotfinance-backup
        env:
          DOT_FINANCE_PROTOTYPE_PASSWORD: synthetic-ci-password-not-a-user-secret
      - name: Pass encrypted backup to Linux job
        id: backup
        shell: pwsh
        run: |
          $data = [Convert]::ToBase64String([IO.File]::ReadAllBytes('cycle/portable.dotfinance-backup'))
          "data=$data" >> $env:GITHUB_OUTPUT

  persistence-linux:
    name: Backup cycle (Linux restore)
    needs: persistence-windows
    runs-on: ubuntu-24.04
    outputs:
      backup: ${{ steps.backup.outputs.data }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - run: dotnet restore prototypes/DesktopShell/DesktopShell.csproj --locked-mode
      - name: Receive encrypted backup from Windows job
        shell: pwsh
        env:
          BACKUP_DATA: ${{ needs.persistence-windows.outputs.backup }}
        run: |
          New-Item -ItemType Directory -Force incoming | Out-Null
          [IO.File]::WriteAllBytes('incoming/portable.dotfinance-backup', [Convert]::FromBase64String($env:BACKUP_DATA))
      - run: dotnet run --project prototypes/DesktopShell/DesktopShell.csproj --no-restore --configuration Release -- --persistence-cycle continue cycle prototypes/DesktopShell/Fixtures/synthetic-emma.csv incoming/portable.dotfinance-backup
        env:
          DOT_FINANCE_PROTOTYPE_PASSWORD: synthetic-ci-password-not-a-user-secret
      - name: Pass encrypted backup to final macOS job
        id: backup
        shell: pwsh
        run: |
          $data = [Convert]::ToBase64String([IO.File]::ReadAllBytes('cycle/portable.dotfinance-backup'))
          "data=$data" >> $env:GITHUB_OUTPUT

  persistence-macos-final:
    name: Backup cycle (macOS final restore)
    needs: persistence-linux
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - run: dotnet restore prototypes/DesktopShell/DesktopShell.csproj --locked-mode
      - name: Receive encrypted backup from Linux job
        shell: pwsh
        env:
          BACKUP_DATA: ${{ needs.persistence-linux.outputs.backup }}
        run: |
          New-Item -ItemType Directory -Force incoming | Out-Null
          [IO.File]::WriteAllBytes('incoming/portable.dotfinance-backup', [Convert]::FromBase64String($env:BACKUP_DATA))
      - run: dotnet run --project prototypes/DesktopShell/DesktopShell.csproj --no-restore --configuration Release -- --persistence-cycle verify cycle prototypes/DesktopShell/Fixtures/synthetic-emma.csv incoming/portable.dotfinance-backup
        env:
          DOT_FINANCE_PROTOTYPE_PASSWORD: synthetic-ci-password-not-a-user-secret
