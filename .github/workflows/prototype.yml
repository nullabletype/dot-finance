name: Prototype validation
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    name: Desktop and architecture (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
          cache: npm
      - run: npm ci
      - name: Linux desktop prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb libice6 libsm6 libfontconfig1 libx11-6 libxext6 libxrender1 strace
      - run: npm run build
      - run: npm run persistence:smoke
      - name: Persistence with networking blocked and traced (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p artifacts/offline-network
          sudo env DOTNET_EnableDiagnostics=0 DOT_FINANCE_PROTOTYPE_PASSWORD=synthetic-ci-password-not-a-user-secret unshare --net strace -f -e trace=network -o artifacts/offline-network/network.trace dotnet artifacts/desktop/DesktopShell.dll --persistence-cycle initialize artifacts/offline-network/state artifacts/desktop/Fixtures/synthetic-emma.csv
          sudo chmod -R a+rX artifacts/offline-network
          if grep -E 'socket\(|connect\(|sendto\(' artifacts/offline-network/network.trace; then
            echo 'Unexpected network syscall from persistence scenario'
            exit 1
          fi
      - name: Native launch (Linux virtual display)
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a npm run smoke
          xvfb-run -a npm run workflow:smoke
      - name: Native launch (macOS and Windows)
        if: runner.os != 'Linux'
        run: |
          npm run smoke
          npm run workflow:smoke
  persistence-macos:
    name: Backup cycle (macOS start)
    needs: desktop
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - run: dotnet restore prototypes/DesktopShell/DesktopShell.csproj --locked-mode
      - run: dotnet run --project prototypes/DesktopShell/DesktopShell.csproj --no-restore --configuration Release -- --persistence-cycle initialize cycle prototypes/DesktopShell/Fixtures/synthetic-emma.csv
        env:
          DOT_FINANCE_PROTOTYPE_PASSWORD: synthetic-ci-password-not-a-user-secret
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: persistence-cycle-macos-${{ github.sha }}
          path: cycle/portable.dotfinance-backup
          retention-days: 1

  persistence-windows:
    name: Backup cycle (Windows restore)
    needs: persistence-macos
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - run: dotnet restore prototypes/DesktopShell/DesktopShell.csproj --locked-mode
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: persistence-cycle-macos-${{ github.sha }}
          path: incoming
      - run: dotnet run --project prototypes/DesktopShell/DesktopShell.csproj --no-restore --configuration Release -- --persistence-cycle continue cycle prototypes/DesktopShell/Fixtures/synthetic-emma.csv incoming/portable.dotfinance-backup
        env:
          DOT_FINANCE_PROTOTYPE_PASSWORD: synthetic-ci-password-not-a-user-secret
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: persistence-cycle-windows-${{ github.sha }}
          path: cycle/portable.dotfinance-backup
          retention-days: 1

  persistence-linux:
    name: Backup cycle (Linux restore)
    needs: persistence-windows
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - run: dotnet restore prototypes/DesktopShell/DesktopShell.csproj --locked-mode
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: persistence-cycle-windows-${{ github.sha }}
          path: incoming
      - run: dotnet run --project prototypes/DesktopShell/DesktopShell.csproj --no-restore --configuration Release -- --persistence-cycle continue cycle prototypes/DesktopShell/Fixtures/synthetic-emma.csv incoming/portable.dotfinance-backup
        env:
          DOT_FINANCE_PROTOTYPE_PASSWORD: synthetic-ci-password-not-a-user-secret
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: persistence-cycle-linux-${{ github.sha }}
          path: cycle/portable.dotfinance-backup
          retention-days: 1

  persistence-macos-final:
    name: Backup cycle (macOS final restore)
    needs: persistence-linux
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - run: dotnet restore prototypes/DesktopShell/DesktopShell.csproj --locked-mode
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: persistence-cycle-linux-${{ github.sha }}
          path: incoming
      - run: dotnet run --project prototypes/DesktopShell/DesktopShell.csproj --no-restore --configuration Release -- --persistence-cycle verify cycle prototypes/DesktopShell/Fixtures/synthetic-emma.csv incoming/portable.dotfinance-backup
        env:
          DOT_FINANCE_PROTOTYPE_PASSWORD: synthetic-ci-password-not-a-user-secret
