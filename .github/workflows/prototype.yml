name: Prototype validation
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    name: Desktop and architecture (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
          cache: npm
      - run: npm ci
      - name: Controller interruption and recovery trial
        run: npm run controller:trial
      - name: Linux desktop prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb libice6 libsm6 libfontconfig1 libx11-6 libxext6 libxrender1 strace
      - run: npm run build
      - run: npm run persistence:smoke
      - name: Persistence with networking blocked and traced (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p artifacts/offline-network
          sudo env DOTNET_EnableDiagnostics=0 DOT_FINANCE_PROTOTYPE_PASSWORD=synthetic-ci-password-not-a-user-secret unshare --net strace -f -e trace=network -o artifacts/offline-network/network.trace dotnet artifacts/desktop/DesktopShell.dll --persistence-cycle initialize artifacts/offline-network/state artifacts/desktop/Fixtures/synthetic-emma.csv
          sudo chmod -R a+rX artifacts/offline-network
          if grep -E 'socket\(|connect\(|sendto\(' artifacts/offline-network/network.trace; then
            echo 'Unexpected network syscall from persistence scenario'
            exit 1
          fi
      - name: Production native launch with networking blocked and traced (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo unshare --net runuser -u "$(id -un)" -- env PATH="$PATH" CI=true DOTNET_EnableDiagnostics=0 xvfb-run -a strace -f -e trace=network -o artifacts/production-network.trace node scripts/production-smoke.mjs
          sudo unshare --net runuser -u "$(id -un)" -- env PATH="$PATH" CI=true DOTNET_EnableDiagnostics=0 strace -f -e trace=network -o artifacts/production-vault-network.trace node scripts/production-vault-smoke.mjs
          if grep -E 'socket\(AF_INET6?,|connect\(.*sa_family=AF_INET' artifacts/production-network.trace artifacts/production-vault-network.trace; then
            echo 'Unexpected Internet socket attempt from production launch'
            exit 1
          fi
      - name: Native launch (Linux virtual display)
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a npm run production:smoke
          xvfb-run -a npm run smoke
          xvfb-run -a npm run workflow:smoke
      - name: Native launch (macOS and Windows)
        if: runner.os != 'Linux'
        run: |
          npm run production:smoke
          npm run production:vault
          npm run smoke
          npm run workflow:smoke
  persistence-macos:
    name: Production backup cycle (macOS start)
    needs: desktop
    runs-on: macos-15
    outputs:
      backup0: ${{ steps.backup.outputs.data0 }}
      backup1: ${{ steps.backup.outputs.data1 }}
      backup2: ${{ steps.backup.outputs.data2 }}
      backup3: ${{ steps.backup.outputs.data3 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - run: dotnet restore DotFinance.slnx --locked-mode
      - run: dotnet publish src/DotFinance.Desktop/DotFinance.Desktop.csproj --no-restore --configuration Release --runtime osx-arm64 --output production
      - run: ./production/DotFinance.Desktop --vault-cycle initialize cycle
        env:
          DOT_FINANCE_VAULT_PASSWORD: synthetic-ci-password-not-a-user-secret
          DOTNET_BUNDLE_EXTRACT_BASE_DIR: ${{ runner.temp }}/dot-finance-extracted
      - name: Pass encrypted backup to Windows job
        id: backup
        shell: pwsh
        run: |
          $data = [Convert]::ToBase64String([IO.File]::ReadAllBytes('cycle/portable.dotfinance-backup'))
          if ($data.Length -gt 240000) { throw "Encrypted backup exceeds the bounded relay size." }
          0..3 | ForEach-Object {
            $offset = $_ * 60000
            $length = [Math]::Min(60000, [Math]::Max(0, $data.Length - $offset))
            $chunk = if ($length -eq 0) { '' } else { $data.Substring($offset, $length) }
            "data$_=$chunk" >> $env:GITHUB_OUTPUT
          }

  persistence-windows:
    name: Production backup cycle (Windows restore)
    needs: persistence-macos
    runs-on: windows-2025
    outputs:
      backup0: ${{ steps.backup.outputs.data0 }}
      backup1: ${{ steps.backup.outputs.data1 }}
      backup2: ${{ steps.backup.outputs.data2 }}
      backup3: ${{ steps.backup.outputs.data3 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - run: dotnet restore DotFinance.slnx --locked-mode
      - run: dotnet publish src/DotFinance.Desktop/DotFinance.Desktop.csproj --no-restore --configuration Release --runtime win-x64 --output production
      - name: Receive encrypted backup from macOS job
        shell: pwsh
        env:
          BACKUP_DATA_0: ${{ needs.persistence-macos.outputs.backup0 }}
          BACKUP_DATA_1: ${{ needs.persistence-macos.outputs.backup1 }}
          BACKUP_DATA_2: ${{ needs.persistence-macos.outputs.backup2 }}
          BACKUP_DATA_3: ${{ needs.persistence-macos.outputs.backup3 }}
        run: |
          New-Item -ItemType Directory -Force incoming | Out-Null
          $data = $env:BACKUP_DATA_0 + $env:BACKUP_DATA_1 + $env:BACKUP_DATA_2 + $env:BACKUP_DATA_3
          [IO.File]::WriteAllBytes('incoming/portable.dotfinance-backup', [Convert]::FromBase64String($data))
      - run: .\production\DotFinance.Desktop.exe --vault-cycle continue cycle incoming/portable.dotfinance-backup
        env:
          DOT_FINANCE_VAULT_PASSWORD: synthetic-ci-password-not-a-user-secret
          DOTNET_BUNDLE_EXTRACT_BASE_DIR: ${{ runner.temp }}/dot-finance-extracted
      - name: Pass encrypted backup to Linux job
        id: backup
        shell: pwsh
        run: |
          $data = [Convert]::ToBase64String([IO.File]::ReadAllBytes('cycle/portable.dotfinance-backup'))
          if ($data.Length -gt 240000) { throw "Encrypted backup exceeds the bounded relay size." }
          0..3 | ForEach-Object {
            $offset = $_ * 60000
            $length = [Math]::Min(60000, [Math]::Max(0, $data.Length - $offset))
            $chunk = if ($length -eq 0) { '' } else { $data.Substring($offset, $length) }
            "data$_=$chunk" >> $env:GITHUB_OUTPUT
          }

  persistence-linux:
    name: Production backup cycle (Linux restore)
    needs: persistence-windows
    runs-on: ubuntu-24.04
    outputs:
      backup0: ${{ steps.backup.outputs.data0 }}
      backup1: ${{ steps.backup.outputs.data1 }}
      backup2: ${{ steps.backup.outputs.data2 }}
      backup3: ${{ steps.backup.outputs.data3 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - run: dotnet restore DotFinance.slnx --locked-mode
      - run: dotnet publish src/DotFinance.Desktop/DotFinance.Desktop.csproj --no-restore --configuration Release --runtime linux-x64 --output production
      - name: Receive encrypted backup from Windows job
        shell: pwsh
        env:
          BACKUP_DATA_0: ${{ needs.persistence-windows.outputs.backup0 }}
          BACKUP_DATA_1: ${{ needs.persistence-windows.outputs.backup1 }}
          BACKUP_DATA_2: ${{ needs.persistence-windows.outputs.backup2 }}
          BACKUP_DATA_3: ${{ needs.persistence-windows.outputs.backup3 }}
        run: |
          New-Item -ItemType Directory -Force incoming | Out-Null
          $data = $env:BACKUP_DATA_0 + $env:BACKUP_DATA_1 + $env:BACKUP_DATA_2 + $env:BACKUP_DATA_3
          [IO.File]::WriteAllBytes('incoming/portable.dotfinance-backup', [Convert]::FromBase64String($data))
      - run: ./production/DotFinance.Desktop --vault-cycle continue cycle incoming/portable.dotfinance-backup
        env:
          DOT_FINANCE_VAULT_PASSWORD: synthetic-ci-password-not-a-user-secret
          DOTNET_BUNDLE_EXTRACT_BASE_DIR: ${{ runner.temp }}/dot-finance-extracted
      - name: Pass encrypted backup to final macOS job
        id: backup
        shell: pwsh
        run: |
          $data = [Convert]::ToBase64String([IO.File]::ReadAllBytes('cycle/portable.dotfinance-backup'))
          if ($data.Length -gt 240000) { throw "Encrypted backup exceeds the bounded relay size." }
          0..3 | ForEach-Object {
            $offset = $_ * 60000
            $length = [Math]::Min(60000, [Math]::Max(0, $data.Length - $offset))
            $chunk = if ($length -eq 0) { '' } else { $data.Substring($offset, $length) }
            "data$_=$chunk" >> $env:GITHUB_OUTPUT
          }

  persistence-macos-final:
    name: Production backup cycle (macOS final restore)
    needs: persistence-linux
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - run: dotnet restore DotFinance.slnx --locked-mode
      - run: dotnet publish src/DotFinance.Desktop/DotFinance.Desktop.csproj --no-restore --configuration Release --runtime osx-arm64 --output production
      - name: Receive encrypted backup from Linux job
        shell: pwsh
        env:
          BACKUP_DATA_0: ${{ needs.persistence-linux.outputs.backup0 }}
          BACKUP_DATA_1: ${{ needs.persistence-linux.outputs.backup1 }}
          BACKUP_DATA_2: ${{ needs.persistence-linux.outputs.backup2 }}
          BACKUP_DATA_3: ${{ needs.persistence-linux.outputs.backup3 }}
        run: |
          New-Item -ItemType Directory -Force incoming | Out-Null
          $data = $env:BACKUP_DATA_0 + $env:BACKUP_DATA_1 + $env:BACKUP_DATA_2 + $env:BACKUP_DATA_3
          [IO.File]::WriteAllBytes('incoming/portable.dotfinance-backup', [Convert]::FromBase64String($data))
      - run: ./production/DotFinance.Desktop --vault-cycle verify cycle incoming/portable.dotfinance-backup
        env:
          DOT_FINANCE_VAULT_PASSWORD: synthetic-ci-password-not-a-user-secret
          DOTNET_BUNDLE_EXTRACT_BASE_DIR: ${{ runner.temp }}/dot-finance-extracted
