name: Prototype validation
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    name: Desktop and architecture (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24.21.0'
          cache: npm
      - run: npm ci
      - name: Linux desktop prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb libice6 libsm6 libfontconfig1 libx11-6 libxext6 libxrender1 strace
      - run: npm run build
      - run: npm run persistence:smoke
      - run: npm run snapshots:fault-smoke
      - name: Persistence with networking blocked and traced (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p artifacts/offline-network
          sudo env DOTNET_EnableDiagnostics=0 DOT_FINANCE_PROTOTYPE_PASSWORD=synthetic-ci-password-not-a-user-secret unshare --net strace -f -e trace=network -o artifacts/offline-network/network.trace dotnet artifacts/desktop/DesktopShell.dll --persistence-cycle initialize artifacts/offline-network/state artifacts/desktop/Fixtures/synthetic-emma.csv
          sudo chmod -R a+rX artifacts/offline-network
          if grep -E 'socket\(|connect\(|sendto\(' artifacts/offline-network/network.trace; then
            echo 'Unexpected network syscall from persistence scenario'
            exit 1
          fi
      - name: Authenticated snapshots with networking blocked and traced (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p artifacts/offline-network artifacts/authenticated-snapshots
          sudo env DOTNET_EnableDiagnostics=0 unshare --net strace -f -e trace=network -o artifacts/offline-network/snapshots.trace dotnet prototypes/AuthenticatedSnapshots.Trial/bin/Release/net10.0/AuthenticatedSnapshots.Trial.dll --output artifacts/authenticated-snapshots/offline.json
          sudo chmod -R a+rX artifacts/authenticated-snapshots artifacts/offline-network
          if grep -E 'socket\(|connect\(|sendto\(' artifacts/offline-network/snapshots.trace; then
            echo 'Unexpected network syscall from authenticated snapshots scenario'
            exit 1
          fi
      - name: Native launch (Linux virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run smoke
      - name: Native launch (macOS and Windows)
        if: runner.os != 'Linux'
        run: npm run smoke
      - name: Preserve evidence and build outputs
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: prototype-${{ matrix.os }}-${{ github.sha }}
          path: |
            artifacts/build.json
            artifacts/authenticated-snapshots/
            artifacts/snapshot-trial/
          retention-days: 1
          if-no-files-found: error

  snapshot-cycle-macos:
    name: Snapshot backup cycle (macOS start)
    needs: desktop
    runs-on: macos-latest
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: prototype-macos-latest-${{ github.sha }}
          path: build
      - run: mkdir -p cycle && dotnet build/snapshot-trial/AuthenticatedSnapshots.Trial.dll --cycle initialize cycle cycle/portable.dfsnap
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: snapshot-cycle-macos-${{ github.sha }}
          path: cycle/portable.dfsnap
          retention-days: 1

  snapshot-cycle-linux:
    name: Snapshot backup cycle (Linux restore)
    needs: snapshot-cycle-macos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: prototype-ubuntu-latest-${{ github.sha }}
          path: build
      - uses: actions/download-artifact@v8.0.1
        with:
          name: snapshot-cycle-macos-${{ github.sha }}
          path: incoming
      - run: mkdir -p cycle && dotnet build/snapshot-trial/AuthenticatedSnapshots.Trial.dll --cycle continue cycle incoming/portable.dfsnap cycle/portable.dfsnap
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: snapshot-cycle-linux-${{ github.sha }}
          path: cycle/portable.dfsnap
          retention-days: 1

  snapshot-cycle-macos-final:
    name: Snapshot backup cycle (macOS final restore)
    needs: snapshot-cycle-linux
    runs-on: macos-latest
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: prototype-macos-latest-${{ github.sha }}
          path: build
      - uses: actions/download-artifact@v8.0.1
        with:
          name: snapshot-cycle-linux-${{ github.sha }}
          path: incoming
      - run: mkdir -p cycle && dotnet build/snapshot-trial/AuthenticatedSnapshots.Trial.dll --cycle verify cycle incoming/portable.dfsnap

  snapshot-cycle-windows:
    name: Snapshot backup cycle (Windows restore)
    needs: snapshot-cycle-linux
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: prototype-windows-latest-${{ github.sha }}
          path: build
      - uses: actions/download-artifact@v8.0.1
        with:
          name: snapshot-cycle-linux-${{ github.sha }}
          path: incoming
      - shell: pwsh
        run: |
          New-Item -ItemType Directory -Force cycle | Out-Null
          dotnet build/snapshot-trial/AuthenticatedSnapshots.Trial.dll --cycle verify cycle incoming/portable.dfsnap
