name: Prototype validation
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    name: Desktop and architecture (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: npm
      - run: npm ci
      - name: Linux desktop prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb libice6 libsm6 libfontconfig1 libx11-6 libxext6 libxrender1 strace
      - run: npm run build
      - run: npm run persistence:smoke
      - name: Persistence with networking blocked and traced (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p artifacts/offline-network
          sudo env DOTNET_EnableDiagnostics=0 DOT_FINANCE_PROTOTYPE_PASSWORD=synthetic-ci-password-not-a-user-secret unshare --net strace -f -e trace=network -o artifacts/offline-network/network.trace dotnet artifacts/desktop/DesktopShell.dll --persistence-cycle initialize artifacts/offline-network/state artifacts/desktop/Fixtures/synthetic-emma.csv
          sudo chmod -R a+rX artifacts/offline-network
          if grep -E 'socket\(|connect\(|sendto\(' artifacts/offline-network/network.trace; then
            echo 'Unexpected network syscall from persistence scenario'
            exit 1
          fi
      - name: Native launch (Linux virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run smoke
      - name: Native launch (macOS and Windows)
        if: runner.os != 'Linux'
        run: npm run smoke
      - name: Preserve evidence and build outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prototype-${{ matrix.os }}-${{ github.sha }}
          path: |
            artifacts/architecture/
            artifacts/desktop/
            artifacts/launch-*/
            artifacts/persistence-local/
            artifacts/offline-network/
            artifacts/build.json
          retention-days: 7
          if-no-files-found: error

  persistence-macos:
    name: Backup cycle (macOS start)
    needs: desktop
    runs-on: macos-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: prototype-macos-latest-${{ github.sha }}
          path: build
      - run: mkdir -p cycle && DOT_FINANCE_PROTOTYPE_PASSWORD=synthetic-ci-password-not-a-user-secret dotnet build/desktop/DesktopShell.dll --persistence-cycle initialize cycle build/desktop/Fixtures/synthetic-emma.csv
      - uses: actions/upload-artifact@v4
        with:
          name: persistence-cycle-macos-${{ github.sha }}
          path: cycle/
          retention-days: 7

  persistence-windows:
    name: Backup cycle (Windows restore)
    needs: persistence-macos
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: prototype-windows-latest-${{ github.sha }}
          path: build
      - uses: actions/download-artifact@v4
        with:
          name: persistence-cycle-macos-${{ github.sha }}
          path: incoming
      - shell: pwsh
        run: |
          New-Item -ItemType Directory -Force cycle | Out-Null
          $env:DOT_FINANCE_PROTOTYPE_PASSWORD = 'synthetic-ci-password-not-a-user-secret'
          dotnet build/desktop/DesktopShell.dll --persistence-cycle continue cycle build/desktop/Fixtures/synthetic-emma.csv incoming/portable.dotfinance-backup
      - uses: actions/upload-artifact@v4
        with:
          name: persistence-cycle-windows-${{ github.sha }}
          path: cycle/
          retention-days: 7

  persistence-linux:
    name: Backup cycle (Linux restore)
    needs: persistence-windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: prototype-ubuntu-latest-${{ github.sha }}
          path: build
      - uses: actions/download-artifact@v4
        with:
          name: persistence-cycle-windows-${{ github.sha }}
          path: incoming
      - run: mkdir -p cycle && DOT_FINANCE_PROTOTYPE_PASSWORD=synthetic-ci-password-not-a-user-secret dotnet build/desktop/DesktopShell.dll --persistence-cycle continue cycle build/desktop/Fixtures/synthetic-emma.csv incoming/portable.dotfinance-backup
      - uses: actions/upload-artifact@v4
        with:
          name: persistence-cycle-linux-${{ github.sha }}
          path: cycle/
          retention-days: 7

  persistence-macos-final:
    name: Backup cycle (macOS final restore)
    needs: persistence-linux
    runs-on: macos-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: prototype-macos-latest-${{ github.sha }}
          path: build
      - uses: actions/download-artifact@v4
        with:
          name: persistence-cycle-linux-${{ github.sha }}
          path: incoming
      - run: mkdir -p cycle && DOT_FINANCE_PROTOTYPE_PASSWORD=synthetic-ci-password-not-a-user-secret dotnet build/desktop/DesktopShell.dll --persistence-cycle verify cycle build/desktop/Fixtures/synthetic-emma.csv incoming/portable.dotfinance-backup
      - uses: actions/upload-artifact@v4
        with:
          name: persistence-cycle-final-${{ github.sha }}
          path: cycle/
          retention-days: 7
